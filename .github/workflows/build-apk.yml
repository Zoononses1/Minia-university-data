name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare folders
        run: |
          mkdir -p www assets
          cp index.html style.css schema.js xlsx.js app.js sw.js manifest.webmanifest icon-192.png icon-512.png www/
          cp icon-only.png icon-foreground.png icon-background.png assets/
      - run: npm install
      - run: npx cap add android
      - name: Generate icons
        continue-on-error: true
        run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Minia-University-Data.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Minia-University-Data-APK
          path: Minia-University-Data.apk
